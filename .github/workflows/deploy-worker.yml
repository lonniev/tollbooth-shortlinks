# Deploys the shortlink redirect (worker/redirect.js) as a Cloudflare Worker.
#
# A change to it on main deploys it to go.tollbooth-dpyc.com, then checks an
# unknown slug gets the "Link Not Found" page.
#
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit, plus
# Workers Routes and DNS edit on the tollbooth-dpyc.com zone) and
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy redirect Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  REDIRECT_HOST: go.tollbooth-dpyc.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: The redirect answers
        run: |
          set -euo pipefail
          # A slug that was never made must get the "Link Not Found" page.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o page.html -w "%{http_code}" "https://$REDIRECT_HOST/never-made-slug-check" || true)
            if [ "$status" = 404 ] && grep -q "Link Not Found" page.html; then
              echo "https://$REDIRECT_HOST/ answers."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$REDIRECT_HOST/ answered $status without the expected page."
          exit 1
