name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The build-and-verify contract every DPYC MCP shares. An Advocate is not an
      # Operator, but it is still Python deployed to Horizon, and there is no reason
      # to build it a second way.
      - uses: lonniev/dpyc-community/.github/actions/mcp-ci@main
